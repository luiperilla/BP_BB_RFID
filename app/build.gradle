plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agp.uhf'
    compileSdk 34

    defaultConfig {
        applicationId "com.agp.uhf"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Dirección del Servidor RFID (ServidorRFID/servidor_rfid.py).
        // Antes estaba repetida en 6 sitios dentro de AsociarFragment y
        // ConsultarFragment; ahora se cambia solo aquí y hay que recompilar.
        // Si se mueve el servidor o cambia el puerto, esta es la única línea
        // que se toca — pero sigue obligando a reinstalar el APK en los C5.
        buildConfigField "String", "API_BASE_URL", "\"http://192.168.2.112:8390\""
    }
    signingConfigs {
        debug {
            File strFile = new File("/uhf-serial_release.jks")
            storeFile file(strFile)
            storePassword "123456"
            keyPassword "123456"
            keyAlias "uhf-serial-key"
        }
        release {
            File strFile = new File("/uhf-serial_release.jks")
            storeFile file(strFile)
            storePassword "123456"
            keyPassword "12345/6"
            keyAlias "uhf-serial-key"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // 自定义apk名称
        android.applicationVariants.all { variant ->
            variant.outputs.all {
                outputFileName = "AGP_UHF${defaultConfig.versionName}.apk"
            }
        }
    }

    buildFeatures {
        viewBinding true
        // Necesario desde AGP 8: sin esto no se genera la clase BuildConfig
        // y API_BASE_URL no existiría en tiempo de compilación.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.*'])
    implementation files('libs/jxl.jar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}